# Alembic configuration for the CloudOps AI backend.
# Run commands from the backend/ directory, e.g. `alembic upgrade head`.
# The database URL is NOT stored here: env.py reads DATABASE_URL (environment or .env).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Revision files are named <date>_<revision>_<slug>.py so they sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
